name: CI — Build & Test

on:
  push:
    branches: [main, feat/*, fix/*]
  pull_request:
    branches: [main]

jobs:
  backend-lint-and-build:
    name: Backend — Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canteen-manager/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: canteen-manager/backend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend-unit-tests:
    name: Backend — Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canteen-manager/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: canteen-manager/backend/package-lock.json
      - run: npm ci
      - run: npx jest --config jest.config.js --ci --forceExit

  backend-sqlite-integration:
    name: Backend — SQLite Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canteen-manager/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: canteen-manager/backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx jest --config jest.sqlite.config.js --ci --forceExit

  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canteen-manager/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: canteen-manager/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  electron-build:
    name: Electron — Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canteen-electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: canteen-electron/package-lock.json
      - run: npm ci
      - run: npm run build:electron
