[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "order-scanner"
version = "0.1.0"
description = "CPU-only handwritten order scanner service"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2,<2.4",
    "opencv-python-headless>=5.0.0.93; platform_system != 'Linux' and (platform_system != 'Darwin' or platform_machine != 'arm64')",
    "opencv-contrib-python>=4.10,<5; platform_system == 'Linux' or (platform_system == 'Darwin' and platform_machine == 'arm64')",
    "pillow>=12.3.0",
    "pypdfium2>=5.12.1",
]

[project.optional-dependencies]
paddleocr = [
    "paddleocr==3.7.0; (platform_system == 'Linux' and platform_machine == 'x86_64') or (platform_system == 'Darwin' and platform_machine == 'arm64')",
    "paddlepaddle>=3.2,<4; (platform_system == 'Linux' and platform_machine == 'x86_64') or (platform_system == 'Darwin' and platform_machine == 'arm64')",
]

[dependency-groups]
dev = [
  "mypy>=1.17",
  "pytest>=8.4",
  "ruff>=0.12",
]

[project.scripts]
order-scanner = "order_scanner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/order_scanner"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "order_scanner/migrations"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
