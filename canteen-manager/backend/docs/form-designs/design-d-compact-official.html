<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Design D — Compact Official Form</title>
<style>
  @page { size: A5 landscape; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Times New Roman', serif; background: #f0f0f0; display: flex; justify-content: center; padding: 20px; }
  .page {
    width: 210mm; height: 148mm;
    background: white; padding: 6mm 8mm 5mm;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    position: relative;
    border: 2px solid #000;
  }
  .mark { position: absolute; width: 6px; height: 6px; background: black; }
  .mark.tl { top: 4px; left: 4px; }
  .mark.tr { top: 4px; right: 4px; }
  .mark.bl { bottom: 4px; left: 4px; }
  .mark.br { bottom: 4px; right: 4px; }
  .qr { position: absolute; top: 8px; right: 12px; width: 44px; height: 44px; border: 1px solid #666; display: flex; align-items: center; justify-content: center; font-size: 7px; color: #666; }

  .header-top { text-align: center; border-bottom: 2px solid #000; padding-bottom: 2mm; margin-bottom: 2mm; }
  .header-top h1 { font-size: 15pt; font-weight: bold; }
  .header-top .form-id { font-size: 7pt; color: #666; margin-top: 1mm; }

  .identity { display: grid; grid-template-columns: 1fr 1fr; gap: 1mm 10mm; font-size: 8pt; padding: 2mm 0; border-bottom: 1px solid #000; margin-bottom: 2mm; }
  .identity .row { display: flex; align-items: baseline; gap: 1mm; }
  .identity .lbl { font-weight: bold; white-space: nowrap; }
  .identity .underline { flex: 1; border-bottom: 1px dotted #000; min-height: 4mm; }

  .items-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 4mm; }
  .items-col table { width: 100%; border-collapse: collapse; }
  .items-col th {
    font-size: 6.5pt; text-align: left; padding: 1.5mm 1.5mm;
    border-bottom: 1.5px solid #000; border-top: 1.5px solid #000;
    font-weight: bold; text-transform: uppercase;
  }
  .items-col th.r { text-align: right; }
  .items-col th.c { text-align: center; }
  .items-col td { font-size: 7pt; padding: 1.2mm 1.5mm; border-bottom: 0.5px solid #ddd; }
  .items-col tr:nth-child(even) td { background: #f9f9f9; }
  .items-col .num { width: 7mm; color: #999; font-size: 6.5pt; }
  .items-col .price { text-align: right; font-family: 'Courier New', monospace; font-size: 6.5pt; color: #555; }
  .items-col .bubbles { text-align: center; white-space: nowrap; }
  .bubble { display: inline-block; width: 8px; height: 8px; border: 1px solid #000; border-radius: 50%; margin: 0 1.5px; }

  .bottom-row { display: flex; justify-content: space-between; align-items: end; margin-top: 2mm; padding-top: 2mm; border-top: 1.5px solid #000; }
  .total { font-size: 9pt; font-weight: bold; }
  .total .underline { display: inline-block; border-bottom: 1px solid #000; min-width: 30mm; margin: 0 2mm; }
  .signatures { display: flex; gap: 15mm; font-size: 7pt; text-align: center; }
  .signatures .sig .line { border-bottom: 1px solid #000; width: 28mm; margin: 6mm auto 1mm; }
  .note { font-size: 5.5pt; color: #888; text-align: center; margin-top: 1mm; }
</style>
</head>
<body>
<div class="page">
  <div class="mark tl"></div><div class="mark tr"></div><div class="mark bl"></div><div class="mark br"></div>
  <div class="qr">QR</div>

  <div class="header-top">
    <h1>PHIẾU ĐẶT HÀNG CANTEEN</h1>
    <div class="form-id">Mẫu TG8-FL · Rev: a5-full_list-20260919</div>
  </div>

  <div class="identity">
    <div class="row"><span class="lbl">Họ tên:</span><span class="underline"></span></div>
    <div class="row"><span class="lbl">Mã số:</span><span class="underline"></span></div>
    <div class="row"><span class="lbl">Buồng/Phòng:</span><span class="underline"></span></div>
    <div class="row"><span class="lbl">Ngày phục vụ:</span><span class="underline"></span></div>
  </div>

  <div class="items-grid">
    <div class="items-col"><table><thead><tr><th>#</th><th>Tên hàng</th><th class="r">Giá</th><th class="c">SL</th></tr></thead><tbody id="left-col"></tbody></table></div>
    <div class="items-col"><table><thead><tr><th>#</th><th>Tên hàng</th><th class="r">Giá</th><th class="c">SL</th></tr></thead><tbody id="right-col"></tbody></table></div>
  </div>

  <div class="bottom-row">
    <div class="total">TỔNG CỘNG: <span class="underline"></span> VNĐ</div>
    <div class="signatures">
      <div class="sig"><div class="line"></div>Phạm nhân</div>
      <div class="sig"><div class="line"></div>Cán bộ quản giáo</div>
    </div>
  </div>
  <div class="note">Tô kín ● một ô tròn cho mỗi phần cần mua. Tối đa 5 phần/món. Không tẩy xóa.</div>
</div>

<script>
const items = [
  ['Mì tôm Hảo Hảo',15000],['Xà phòng Lifebuoy',18000],['Nước suối 500ml',8000],
  ['Kem đánh răng P/S',26000],['Sữa hộp Vinamilk',12000],['Bàn chải đánh răng',14000],
  ['Bánh quy',20000],['Dầu gội gói',5000],['Lạc rang',10000],['Khăn mặt',25000],
  ['Bánh mì ngọt',12000],['Giấy vệ sinh',16000],['Sữa đậu nành',10000],
  ['Bột giặt gói',15000],['Kẹo lạc',10000],['Nước rửa tay',22000],
  ['Bánh gạo',18000],['Lược nhựa',10000],['Cà phê hòa tan',9000],['Bấm móng tay',18000],
  ['Trà túi lọc',15000],['Dép nhựa',55000],['Đường gói',12000],['Áo lót cotton',45000],
  ['Muối lạc',12000],['Quần lót cotton',45000],['Chà bông',30000],['Khẩu trang vải',12000],
  ['Cá hộp',28000],['Bút bi xanh',6000],
];
const half = Math.ceil(items.length / 2);
function render(el, rows, startIdx) {
  rows.forEach(([name, price], i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="num">${String(startIdx+i+1).padStart(2,'0')}</td><td>${name}</td><td class="price">${price.toLocaleString('vi-VN')}</td><td class="bubbles"><span class="bubble"></span><span class="bubble"></span><span class="bubble"></span><span class="bubble"></span><span class="bubble"></span></td>`;
    el.appendChild(tr);
  });
}
render(document.getElementById('left-col'), items.slice(0, half), 0);
render(document.getElementById('right-col'), items.slice(half), half);
</script>
</body>
</html>
