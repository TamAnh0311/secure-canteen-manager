<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Design C — Categorized Sections</title>
<style>
  @page { size: A5 landscape; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f0f0f0; display: flex; justify-content: center; padding: 20px; }
  .page {
    width: 210mm; height: 148mm;
    background: white; padding: 8mm 10mm 6mm;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    position: relative;
  }
  .mark { position: absolute; width: 6px; height: 6px; background: black; }
  .mark.tl { top: 6px; left: 6px; }
  .mark.tr { top: 6px; right: 6px; }
  .mark.bl { bottom: 6px; left: 6px; }
  .mark.br { bottom: 6px; right: 6px; }
  .qr { position: absolute; top: 10px; right: 14px; width: 48px; height: 48px; border: 1px solid #999; display: flex; align-items: center; justify-content: center; font-size: 8px; color: #999; }

  .header { text-align: center; margin-bottom: 3mm; }
  .header h1 { font-size: 13pt; font-weight: 800; letter-spacing: 2px; }
  .subtitle { font-size: 7.5pt; color: #666; margin-top: 1mm; }
  .fields { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 3mm; font-size: 7.5pt; margin-top: 3mm; padding: 2mm 0; border-top: 2px solid #000; border-bottom: 1px solid #ccc; }
  .field label { font-weight: bold; font-size: 7pt; color: #555; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 1mm; }
  .field .val { border-bottom: 1px solid #000; min-height: 5mm; }

  .content { display: grid; grid-template-columns: 1fr 1fr; gap: 0 5mm; margin-top: 3mm; }

  .category { margin-bottom: 2mm; }
  .cat-header {
    font-size: 7pt; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
    padding: 1.5mm 3mm; margin-bottom: 0;
    color: white; border-radius: 2px 2px 0 0;
  }
  .cat-food .cat-header { background: #e67e22; }
  .cat-essential .cat-header { background: #2980b9; }

  .col-head {
    display: grid; grid-template-columns: 1fr 14mm 30mm;
    padding: 1mm 3mm; font-size: 6pt; font-weight: 600; color: #666;
    text-transform: uppercase; border-bottom: 1px solid #ddd; background: #fafafa;
  }
  .col-head .r { text-align: right; }
  .col-head .c { text-align: center; }

  .item {
    display: grid; grid-template-columns: 1fr 14mm 30mm;
    padding: 1.5mm 3mm; font-size: 7pt;
    border-bottom: 1px solid #f0f0f0;
    align-items: center;
  }
  .item:nth-child(even) { background: #fafcff; }
  .cat-essential .item:nth-child(even) { background: #f5faff; }
  .item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .price { text-align: right; color: #888; font-size: 6.5pt; font-family: monospace; }
  .item .bubbles { display: flex; justify-content: center; gap: 3px; }
  .bubble { width: 9px; height: 9px; border: 1.2px solid #333; border-radius: 50%; }

  .total-box {
    margin-top: 3mm; padding: 2mm 3mm;
    border: 1.5px solid #000; display: flex; justify-content: space-between;
    font-size: 8pt; font-weight: bold;
  }
  .total-box .val { border-bottom: 1px solid #000; min-width: 25mm; display: inline-block; margin-left: 2mm; }

  .footer { margin-top: 2mm; font-size: 5.5pt; color: #888; text-align: center; }
  .sig-row { display: flex; justify-content: space-between; margin-top: 3mm; font-size: 7pt; }
  .sig-row .sig { text-align: center; }
  .sig-row .sig-line { border-bottom: 1px solid #000; width: 35mm; margin: 8mm auto 1mm; }
</style>
</head>
<body>
<div class="page">
  <div class="mark tl"></div><div class="mark tr"></div><div class="mark bl"></div><div class="mark br"></div>
  <div class="qr">QR</div>

  <div class="header">
    <h1>PHIẾU ĐẶT HÀNG CANTEEN</h1>
    <div class="subtitle">Trại tạm giam — Đánh dấu ○ số lượng cho từng món</div>
  </div>

  <div class="fields">
    <div class="field"><label>Họ tên</label><div class="val"></div></div>
    <div class="field"><label>Mã số tù</label><div class="val"></div></div>
    <div class="field"><label>Buồng / Phòng</label><div class="val"></div></div>
    <div class="field"><label>Ngày phục vụ</label><div class="val"></div></div>
  </div>

  <div class="content">
    <div class="category cat-food">
      <div class="cat-header">🍜 Thực phẩm</div>
      <div class="col-head"><span>Tên hàng</span><span class="r">Giá</span><span class="c">Số lượng</span></div>
      <div id="food-items"></div>
    </div>
    <div class="category cat-essential">
      <div class="cat-header">🧴 Đồ dùng thiết yếu</div>
      <div class="col-head"><span>Tên hàng</span><span class="r">Giá</span><span class="c">Số lượng</span></div>
      <div id="essential-items"></div>
    </div>
  </div>

  <div class="total-box">
    <span>TỔNG TIỀN:</span>
    <span><span class="val">&nbsp;</span> VNĐ</span>
  </div>

  <div class="sig-row">
    <div class="sig"><div class="sig-line"></div>Người đặt hàng</div>
    <div class="sig"><div class="sig-line"></div>Cán bộ xác nhận</div>
  </div>
</div>

<script>
const food = [
  ['Mì tôm Hảo Hảo',15000],['Nước suối 500ml',8000],['Sữa hộp Vinamilk',12000],
  ['Bánh quy',20000],['Lạc rang',10000],['Bánh mì ngọt',12000],
  ['Sữa đậu nành',10000],['Kẹo lạc',10000],['Bánh gạo',18000],
  ['Cà phê hòa tan',9000],['Trà túi lọc',15000],['Đường gói',12000],
  ['Muối lạc',12000],['Chà bông',30000],
];
const essential = [
  ['Xà phòng Lifebuoy',18000],['Kem đánh răng P/S',26000],['Bàn chải đánh răng',14000],
  ['Dầu gội gói',5000],['Khăn mặt',25000],['Giấy vệ sinh',16000],
  ['Bột giặt gói',15000],['Nước rửa tay',22000],['Lược nhựa',10000],
  ['Bấm móng tay',18000],['Dép nhựa',55000],['Áo lót cotton',45000],
  ['Quần lót cotton',45000],['Khẩu trang vải',12000],
];
function render(el, rows) {
  rows.forEach(([name, price]) => {
    const d = document.createElement('div');
    d.className = 'item';
    d.innerHTML = `<span class="name">${name}</span><span class="price">${(price/1000).toFixed(0)}k</span><span class="bubbles"><span class="bubble"></span><span class="bubble"></span><span class="bubble"></span><span class="bubble"></span><span class="bubble"></span></span>`;
    el.appendChild(d);
  });
}
render(document.getElementById('food-items'), food);
render(document.getElementById('essential-items'), essential);
</script>
</body>
</html>
