server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API reverse proxy. The client uses an `/api` base; the backend serves
    # routes at root, so the trailing slash on proxy_pass strips the `/api`
    # prefix (mirrors the dev-server rewrite in vite.config.ts). `backend` is
    # the API service hostname on the deployment network.
    location /api/ {
        # Scan stations upload base64-encoded images through this LAN-facing
        # endpoint. Leave a small proxy envelope above the backend's 15 MB JSON
        # parser limit so the application remains the authoritative limit.
        client_max_body_size 16m;
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
